<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112142" />
    <meta
      name="description"
      content="JAV Nepal — interactive smart board and display solutions for classrooms, training rooms and boardrooms."
    />

    <!--
      Static fallback for crawlers and scrapers that do not execute JavaScript.
      On every route these are then kept in step with the current page by the
      usePageMeta hook (src/hooks/usePageMeta.js), which is also where the
      canonical link and og:url come from once siteConfig.siteUrl is supplied.
    -->
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="JAV Nepal" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta
      property="og:title"
      content="JAV Nepal — Interactive Smart Board Solutions"
    />
    <meta
      property="og:description"
      content="Interactive smart boards and large-format displays for classrooms, training rooms and boardrooms."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>JAV Nepal — Interactive Smart Board Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
